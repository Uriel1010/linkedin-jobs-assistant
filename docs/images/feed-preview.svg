<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Compact Telegram digest with categories and page jumping</title><desc id="desc">Illustration with fictional jobs. Linked titles, compact metadata, category tabs, and a clickable page counter all work in one message.</desc>
<rect width="1200" height="650" rx="24" fill="#edf4fa"/>
<g font-family="Arial,sans-serif" fill="#173149">
<text x="48" y="65" font-size="29" font-weight="700">Find the right job faster.</text>
<text x="48" y="98" font-size="18" fill="#547084">One hourly digest. Categories and pages in the same message.</text>
<rect x="48" y="130" width="650" height="455" rx="20" fill="#fff" stroke="#cedee9"/>
<text x="78" y="171" font-size="21" font-weight="700">Hourly update · 09:00</text><text x="78" y="201" font-size="17" fill="#547084">32 newly found jobs · Page 1/7</text>
<text x="78" y="247" font-size="20" fill="#087cad" font-weight="700">1. Embedded Software Engineer ↗</text>
<text x="78" y="276" font-size="16">Example Company · Haifa · Hybrid</text><text x="78" y="302" font-size="16" fill="#547084">Embedded · Senior · Posted today</text>
<path d="M78 323H668" stroke="#e2ebf1"/>
<text x="78" y="355" font-size="20" fill="#087cad" font-weight="700">2. Firmware Engineer ↗</text>
<text x="78" y="384" font-size="16">Another Example · Tel Aviv · On-site</text><text x="78" y="410" font-size="16" fill="#547084">Embedded · Date not listed</text>
<text x="78" y="449" font-size="15" fill="#547084">Tap a title to open LinkedIn.</text>
<g fill="#e6f1f9"><rect x="78" y="466" width="145" height="38" rx="8"/><rect x="233" y="466" width="220" height="38" rx="8"/><rect x="463" y="466" width="205" height="38" rx="8"/></g>
<g font-size="16" text-anchor="middle" fill="#17688c"><text x="150" y="491">✓ All 32</text><text x="343" y="491">Embedded 22</text><text x="565" y="491">Software 10</text></g>
<g fill="#d8eef9"><rect x="78" y="516" width="180" height="42" rx="8"/><rect x="270" y="516" width="245" height="42" rx="8"/><rect x="527" y="516" width="141" height="42" rx="8"/></g>
<g font-size="18" text-anchor="middle" fill="#17688c"><text x="168" y="543">1/7 ▦</text><text x="392" y="543">Next ›</text><text x="597" y="543">»</text></g>
<text x="751" y="195" font-size="22" font-weight="700">Less reading. Faster navigation.</text>
<g font-size="18" fill="#49677d"><text x="751" y="240">Linked titles, compact cards</text><text x="751" y="286">Your selected roles appear first</text><text x="751" y="332">Category tabs narrow the update</text><text x="751" y="378">Tap the counter to pick a page</text><text x="751" y="424">First / last page shortcuts</text><text x="751" y="470">Up to five jobs per page</text><text x="751" y="516">No per-job Save / Details buttons</text></g>
<text x="48" y="620" font-size="15" fill="#647d90">Illustration, not a live screenshot. Fictional jobs; actual page sizes depend on card length.</text></g></svg>
