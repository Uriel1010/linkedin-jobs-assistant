services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    user: "1000:1000"
    environment:
      LINKEDIN_COLLECTION_ENABLED: "0"
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  feeds:
    build:
      context: .
      dockerfile: Dockerfile.feeds
    restart: unless-stopped
    init: true
    user: "1000:1000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 384m
    cpus: 0.75
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,time; c=sqlite3.connect('file:/app/data/jobs.sqlite3?mode=ro',uri=True); r=c.execute(\"SELECT value FROM service_state WHERE key='feeds_heartbeat'\").fetchone(); assert r and time.time()-float(r[0])<900"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "2"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    init: true
    user: "1000:1000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      JOBS_API_URL: http://api:8765
    volumes:
      - ./bot-data/config.json:/run/bot-config.json:ro
      - ./data/api-key:/run/jobs-api-key:ro
      - ./bot-data/state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 192m
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,json,time; c=sqlite3.connect('/app/state/bot.sqlite3'); r=c.execute(\"SELECT value FROM settings WHERE key='last_poll'\").fetchone(); assert r and time.time()-json.loads(r[0])<240"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "2"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    init: true
    user: "1000:1000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      JOBS_API_URL: http://api:8765
      DASHBOARD_STATE_DIR: /app/state
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - ./data/api-key:/run/jobs-api-key:ro
      - ./dashboard-data:/app/state
      - ./bot-data/state:/app/bot-state
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 384m
    cpus: 0.75
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "2"
